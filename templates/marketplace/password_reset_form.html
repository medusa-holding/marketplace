{% extends "base.html" %}
{% block title %}Recuperar senha{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="mb-3 text-center">Recuperar senha</h4>

          <p class="text-muted">
            Informe o seu email e enviaremos um link para redefinir a senha.
          </p>

          <form method="post">
            {% csrf_token %}
            {{ form.email.label_tag }}
            {{ form.email }}

            <button class="btn btn-primary w-100 mt-3">
              Enviar link
            </button>
          </form>

          <div class="text-center mt-3">
            <a href="{% url 'marketplace:login' %}">Voltar ao login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
