{% extends "base.html" %}
{% block title %}Nova senha{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="mb-3 text-center">Definir nova senha</h4>

          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-success w-100">
              Atualizar senha
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
